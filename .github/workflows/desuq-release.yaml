# Builds and publishes the desuqcafe Syncthing Windows installer.
#
# This workflow belongs to the fork; upstream Syncthing has no file by this
# name, so it never conflicts when merging upstream changes.
#
# Cut a release by tagging a commit, e.g.:
#   git tag v2.1.4-desuq.1 && git push origin v2.1.4-desuq.1
name: desuq release

on:
  push:
    tags:
      - "v*-desuq*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (e.g. v2.1.4-desuq.1)"
        required: true
        default: "v0.0.0-desuq.dev"

# Nothing here needs write access except the job that publishes the release,
# so the token the reusable test job runs with is read-only. Narrowed per job
# rather than granted workflow-wide.
permissions:
  contents: read

jobs:
  # A release cannot be cut from a tree whose tests are red. desuq-test.yaml is
  # a reusable workflow for exactly this, so the suites are defined once and
  # run both on every push to main and as this gate.
  test:
    uses: ./.github/workflows/desuq-test.yaml

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    # The only job that writes anything: it creates the release and uploads the
    # installer to it.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # build-windows.ps1 falls back to `git describe`, which needs tags.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Resolve version
        id: ver
        shell: pwsh
        # Through the environment, not through ${{ }} interpolated into the
        # script. Interpolation pastes the value into the source before
        # PowerShell parses it, so a ref or a dispatch input containing a quote
        # ends the string and the rest runs as code. Both of these are
        # attacker-influenceable by anyone who can push a tag or start a
        # workflow. As env vars they are just data.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          $v = if ($env:EVENT_NAME -eq 'push') { $env:REF_NAME } else { $env:INPUT_VERSION }
          if ($v -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.\-]+)?$') {
            throw "Refusing to build from an unexpected version string: '$v'"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building $v"

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            # Pinned for the same reason goversioninfo is: this produces the
            # installer that gets published, and an unpinned package is
            # whatever the feed serves that minute.
            choco install innosetup --version=6.7.1 --no-progress -y
          }

      # -SkipTests because the `test` job above already ran every suite,
      # including the ones this script's quick set covers.
      - name: Build binary and installer
        shell: pwsh
        run: ./custom/build-windows.ps1 -Version "${{ steps.ver.outputs.version }}" -Installer -SkipTests

      # Only the installer is published. custom/dist also holds the bare daemon
      # and the tray, which are build intermediates the installer already
      # carries -- publishing them put three executables on a page the README
      # sends non-technical people to, two of which they must not download.
      - name: Checksums
        shell: pwsh
        run: |
          $setup = Get-ChildItem custom/dist/*-setup-*.exe
          if ($setup.Count -ne 1) {
            throw "expected exactly one installer in custom/dist, found $($setup.Count)"
          }
          $h = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$h  $($setup.Name)" | Set-Content custom/dist/SHA256SUMS.txt
          Get-Content custom/dist/SHA256SUMS.txt

      # The artifact keeps everything, including the bare binaries: it is for
      # debugging a build, not for handing to anybody.
      - uses: actions/upload-artifact@v7
        with:
          name: desuq-syncthing-windows
          path: |
            custom/dist/*.exe
            custom/dist/SHA256SUMS.txt

      # The release body, assembled rather than inlined.
      #
      # softprops/action-gh-release ignores `body` entirely when `body_path` is
      # set -- it is fallback, not a second half -- so the two parts are joined
      # here instead: what changed, which is written by hand in
      # custom/RELEASE-NOTES.md, and how to install it, which never changes.
      - name: Compose release notes
        shell: pwsh
        run: |
          $notes = 'custom/RELEASE-NOTES.md'
          $out   = 'custom/dist/release-notes.md'
          if (Test-Path $notes) {
            # Strip the leading HTML comment. Markdown hides it when rendered,
            # but it is still in the body the API serves and in every "view
            # source" of the release, and it is a note to whoever edits the
            # file rather than to anybody reading the release.
            $raw = Get-Content $notes -Raw
            $raw = [regex]::Replace($raw, '^\s*<!--.*?-->\s*', '', 'Singleline')
            $raw | Set-Content $out -Encoding utf8
          } else {
            # Thin notes beat a release that failed to publish.
            Write-Warning "$notes is missing; publishing with the install section only."
            "desuqcafe Syncthing ${{ steps.ver.outputs.version }}" | Set-Content $out -Encoding utf8
          }
          # An array rather than a here-string: a here-string's body has to sit
          # at column 0, and column 0 inside a YAML block scalar ends the block.
          $install = @(
            ''
            '---'
            ''
            '## Installing'
            ''
            'Download **`desuq-syncthing-setup-*.exe`** below and run it. No administrator'
            'rights are needed -- it installs into your own account only.'
            ''
            'Windows will warn that the installer is unsigned: **More info -> Run anyway**.'
            '`SHA256SUMS.txt` is next to it if you would rather check the download first.'
            ''
            '**Already have it installed?** Run this installer over the top of it. Your'
            'device identity, your folders and your settings are all kept.'
            ''
            "There is no in-app auto-upgrade: Syncthing verifies updates against upstream's"
            'signing key, which cannot validate builds from this fork. Updating means'
            'running a newer installer.'
          )
          Add-Content $out -Value $install -Encoding utf8
          Get-Content $out

      - name: Publish release
        if: github.event_name == 'push'
        # Pinned to a commit, matching how upstream pins every third-party
        # action in this same tree. "v3" is a ref the action's owner can move,
        # and this step holds contents:write and the GITHUB_TOKEN -- so a moved
        # tag rewrites the installer that non-technical users are sent to
        # download. Resolved from refs/tags/v3 on 2026-08-24.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: ${{ steps.ver.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: custom/dist/release-notes.md
          files: |
            custom/dist/*-setup-*.exe
            custom/dist/SHA256SUMS.txt
